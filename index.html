<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadderTimeline — démo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f5f6fa;
      color: #1a1d23;
      padding: 32px 24px;
      min-height: 100vh;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    p.subtitle {
      font-size: 14px;
      color: #6b7280;
      margin: 0 0 32px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .week-display {
      padding: 7px 18px;
      border-radius: 999px;
      background: #e0eaf0;
      color: #033249;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: opacity 150ms;
    }

    button.demo-btn {
      padding: 7px 18px;
      border-radius: 999px;
      border: 1.5px solid #033249;
      background: #fff;
      color: #033249;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 200ms, color 200ms;
    }

    button.demo-btn:hover {
      background: #033249;
      color: #fff;
    }

    .scale-control {
      display: inline-flex;
      align-items: stretch;
      border: 1.5px solid #033249;
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }

    .scale-control button {
      border: 0;
      background: transparent;
      color: #033249;
      padding: 0 12px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: background 200ms, color 200ms;
    }

    .scale-control button:hover {
      background: #033249;
      color: #fff;
    }

    .scale-control button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .scale-control .scale-label {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #033249;
      border-left: 1.5px solid #033249;
      border-right: 1.5px solid #033249;
      min-width: 130px;
      text-align: center;
      user-select: none;
    }

    .display-mode {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid #033249;
      background: #fff;
      color: #033249;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .display-mode input { accent-color: #033249; cursor: pointer; }

    @media (max-width: 480px) {
      body { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <h1>LadderTimeline</h1>
  <p class="subtitle">Glisser pour naviguer · ↑/↓ pour changer d'échelle</p>

  <div id="timeline-a"></div>

  <div class="actions">
    <span class="week-display" id="week-display">—</span>
    <button class="demo-btn" id="today-btn">Aujourd'hui</button>
    <button class="demo-btn" id="sync-btn">1 jan 2025</button>

    <div class="scale-control" role="group" aria-label="Échelle temporelle">
      <button id="scale-up-btn" type="button" title="Zoom (échelle plus fine)" aria-label="Échelle plus fine">▲</button>
      <span class="scale-label" id="scale-label">Semaine</span>
      <button id="scale-down-btn" type="button" title="Dézoom (échelle plus large)" aria-label="Échelle plus large">▼</button>
    </div>

    <label class="display-mode" title="Bascule l'affichage : étendu (tout) ↔ compact (frontières seules)">
      <input type="checkbox" id="display-mode-toggle" />
      <span>Compact</span>
    </label>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
