<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChronoMap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f5f6fa;
      color: #1a1d23;
      padding: 32px 24px;
      min-height: 100vh;
    }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    p.subtitle { font-size: 14px; color: #6b7280; margin: 0 0 32px; }
    #chronomap {
      width: 100%;
      height: 480px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
  </style>
</head>
<body>

  <h1>ChronoMap</h1>
  <p class="subtitle">Geospatial timeline — démo locale</p>

  <div id="chronomap"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
